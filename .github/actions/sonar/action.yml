name: 'Run Sonar tests'
description: 'Upload code quality scans to Sonar'
inputs:
  github-token:
    description: GitHub token
    required: true
  sonar-token:
    description: Sonar token
    required: true
  sonar-host:
    description: Sonar host URL
    required: true
  coverage-file-names:
    description: Name of the generic coverage file
    required: true
  branch:
    description: Branch
    required: true
  pull-request-number:
    description: PR number
    required: false
  base-branch:
    description: PR target branch
    required: false
  pull-request-sha:
    description: PR commit SHA
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e  #v4.1.7
      with:
        pattern: coverage-file-*
    - shell: bash
      run: mv coverage-file-*/sonar-coverage-*.xml ./
    - name: Install Sonar
      shell: bash
      run: |
        brew install sonar-scanner
    - name: Update sonar-project.properties
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pull-request-number }}
        PR_BRANCH: ${{ inputs.branch }}
        PR_BASE: ${{ inputs.base-branch }}
        PR_SHA: ${{ inputs.pull-request-sha }}
        COVERAGE_FILE_NAMES: ${{ inputs.coverage-file-names }}
      run: |
        echo "sonar.pullrequest.key=${PR_NUMBER}" >> sonar-project.properties
        echo "sonar.pullrequest.branch=${PR_BRANCH}" >> sonar-project.properties
        echo "sonar.pullrequest.base=${PR_BASE}" >> sonar-project.properties
        echo "sonar.scm.revision=${PR_SHA}" >> sonar-project.properties
        echo "sonar.coverageReportPaths=${COVERAGE_FILE_NAMES}" >> sonar-project.properties
    - name: Run Sonar
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        sonar-scanner -Dsonar.token="${SONAR_TOKEN}"
