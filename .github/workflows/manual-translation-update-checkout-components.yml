name: 'Manual Translation Update - CheckoutComponents'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update'
        required: true
        default: 'master'

permissions:
  contents: read

jobs:
  update-translations:
    runs-on: ubuntu-latest
    name: "Download latest CheckoutComponents translations from Phrase.com and make a PR."
    steps:
      - name: Check out repo
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Install Phrase CLI
        uses: phrase/setup-cli@d1c415d0ff01efc1bb21287d60a547669d9331c5
        with:
          version: '2.35.5'

      - name: Write Phrase configuration
        run: |
          # phrase_config_checkout_components.yml declares its own `phrase:` root, so
          # prepending a second one produced a duplicate YAML mapping key. The later block
          # won, the injected secrets were discarded, and the CLI authenticated with the
          # literal string "${PHRASE_ACCESS_TOKEN}". Substitute into the file instead.
          # Check the secrets are set first. An unset secret expands to an empty string,
          # which substitutes cleanly and leaves no placeholder to detect afterwards.
          : "${PHRASE_ACCESS_TOKEN:?secret PHRASE_ACCESS_KEY is empty or unset}"
          : "${PHRASE_PROJECT_ID:?secret PHRASE_PROJECT_ID_CHECKOUT_COMPONENTS is empty or unset}"

          sed -e "s|\${PHRASE_ACCESS_TOKEN}|${PHRASE_ACCESS_TOKEN}|" \
              -e "s|\${PHRASE_PROJECT_ID}|${PHRASE_PROJECT_ID}|" \
              phrase_config_checkout_components.yml > .phrase.yml

          if grep -q '\${PHRASE_' .phrase.yml; then
            echo "::error::A placeholder was left unsubstituted in .phrase.yml."
            exit 1
          fi
        env:
          PHRASE_ACCESS_TOKEN: ${{ secrets.PHRASE_ACCESS_KEY }}
          PHRASE_PROJECT_ID: ${{ secrets.PHRASE_PROJECT_ID_CHECKOUT_COMPONENTS }}

      - name: Download Translations from Phrase
        run: phrase pull

      - name: Remove .phrase.yml file
        run: |
          rm .phrase.yml

      - name: Check for changes in translations folder
        run: |
          if git diff --quiet; then
            echo "No changes detected in translations folder. Exiting."
          else
            echo "Changes detected:"
            git diff
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412
        with:
          token: ${{ secrets.RELEASE_ACCESS_TOKEN }}
          base: ${{ github.event.inputs.branch }}
          branch: update-translations-checkout-components/${{ github.event.inputs.branch }}
          title: "chore: CheckoutComponents Translation Update"
          commit-message: "Update CheckoutComponents translations"
          body: "This PR updates the CheckoutComponents translations from Phrase.com"
